<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="25cm" height="32cm" viewBox="-50 -50 350 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .cut-line { fill: none; stroke: #881d5a; stroke-width: 1.5; stroke-dasharray: 6,3; }
        .border-main { fill: none; stroke: #000; stroke-width: 2; }
        .dim-line { fill: none; stroke: #555; stroke-width: 1; }
        .guide-line { fill: none; stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 2,2; }
        
        /* Typography */
        .tech-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #333; }
        .tech-label { font-family: 'Arial', sans-serif; font-size: 16px; fill: #881d5a; font-weight: bold; text-anchor: middle; }
        .tech-title { font-family: 'Arial', sans-serif; font-size: 18px; fill: #000; font-weight: bold; }
        .dim-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #555; }
        .scale-box { fill: none; stroke: #000; stroke-width: 1; }
    </style>
    
    <!-- No Outer Frame requested -->
    
    <!-- Main Viewport (25x25cm) -->
    <rect x="0" y="0" width="250" height="250" class="border-main"/>
    
    <!-- Grid Diagonal Guide -->
    <line x1="0" y1="0" x2="250" y2="250" class="guide-line"/>
    
    <!-- DIMENSION LINES (Fixed & Clearer) -->
    <!-- Top Width (Offset 20px) -->
    <line x1="0" y1="-20" x2="250" y2="-20" class="dim-line"/>
    <line x1="0" y1="-25" x2="0" y2="-5" class="dim-line"/>     <!-- Left Tick -->
    <line x1="250" y1="-25" x2="250" y2="-5" class="dim-line"/> <!-- Right Tick -->
    <text x="125" y="-30" class="dim-text" text-anchor="middle">25 cm</text>
    
    <!-- Left Height (Offset 20px) -->
    <line x1="-20" y1="0" x2="-20" y2="250" class="dim-line"/>
    <line x1="-25" y1="0" x2="-5" y2="0" class="dim-line"/>     <!-- Top Tick -->
    <line x1="-25" y1="250" x2="-5" y2="250" class="dim-line"/> <!-- Bottom Tick -->
    <text x="-35" y="125" class="dim-text" text-anchor="middle" transform="rotate(-90, -35, 125)">25 cm</text>
    
    <!-- CUTTING LINES (Radiating) -->
    <path class="cut-line" d="M 40,0 Q 40,40 0,40" />
    <text x="25" y="25" class="tech-label">1</text>
    
    <path class="cut-line" d="M 80,0 Q 80,80 0,80" />
    <text x="60" y="60" class="tech-label">2</text>
    
    <path class="cut-line" d="M 120,0 Q 120,120 0,120" />
    <text x="95" y="95" class="tech-label">3</text>
    
    <path class="cut-line" d="M 160,0 Q 160,160 0,160" />
    <text x="130" y="130" class="tech-label">4</text>
    
    <path class="cut-line" d="M 200,0 Q 200,200 0,200" />
    <text x="165" y="165" class="tech-label">5</text>
    
    <text x="220" y="220" class="tech-label">6</text>
    
    <!-- SCALE BOX (Inside Mold - Bottom Right) -->
    <g transform="translate(190, 220)">
        <rect x="0" y="0" width="50" height="20" class="scale-box"/>
        <text x="25" y="14" class="tech-text" text-anchor="middle" font-weight="bold" font-size="10">5 cm</text>
        <text x="25" y="-5" class="dim-text" text-anchor="middle" font-size="10">ESCALA</text>
    </g>
    
    <!-- FOOTER / TITLE BLOCK (Clean Layout - No Overlap) -->
    <!-- Using a simple line separator, no box -->
    <line x1="0" y1="270" x2="250" y2="270" stroke="#000" stroke-width="2"/>
    
    <g transform="translate(0, 290)">
        <!-- Left Column -->
        <text x="0" y="0" class="tech-title">PROJETO: ALMOFADA ORGÂNICA</text>
        <text x="0" y="25" class="tech-text">PEÇA: MOLDE 1/4 (FINAL)</text>
        <text x="0" y="45" class="tech-text">INSTRUÇÃO: CORTAR NA LINHA PONTILHADA</text>
        
        <!-- Right Column (Date) -->
        <!-- Moved slightly left to stay in viewbox -->
        <text x="250" y="0" class="tech-text" text-anchor="end">REV: 02</text>
        <text x="250" y="25" class="tech-text" text-anchor="end">25/01/26</text>
    </g>

</svg>
    